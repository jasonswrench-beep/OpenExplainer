[package]
name = "openexplainer-capture"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "OpenExplainer capture helper: lists the open windows, captures a window, a rectangle or each click. Runs as its own process."

# The empty table below keeps this program separate from the Tauri app (src-tauri), so a problem
# here can never break the app's own build.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

# Only built on Windows. Microsoft's own Rust bindings, MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
