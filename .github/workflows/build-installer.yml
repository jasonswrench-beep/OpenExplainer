# Builds the OpenExplainer installer on a clean Windows machine at GitHub, from the code in this repository, as a check that it builds.
#
# Run it by hand (GitHub, Actions tab, "Build installer", Run workflow), or it runs when a version tag such as v0.2.0-alpha.4 is pushed.
# It only builds. It makes no release and no draft, and it has no permission to: a release is built and signed on the owner's computer with
# tools/build-installer.mjs --sign, which checks every signature in the setup, and published by hand (docs/code-signing.md). So this workflow
# can never publish an unsigned installer.
#
# The build is the same script as a release's, without signing: the folder names of the machine are kept out of both programs and checked, and
# the installer must carry the web view's setup. Its result, a download called "OpenExplainer-installer-unsigned" on the run's page, is for
# checking only. The actions are pinned to the commit of a release, not to a tag that can move.
name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch, 2026-11-13
        with:
          toolchain: stable

      - name: Remember Rust's work between runs
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            src-tauri
            capture-helper

      - name: Install the packages the app needs
        run: npm ci

      - name: Check the licences
        run: node tools/check-licences.mjs

      - name: Check the app
        run: |
          npm run typecheck
          npm test

      - name: Get the AI program (llama.cpp, MIT licence; one pinned build, checked by its SHA-256)
        run: node tools/get-ai-runtime.mjs x64

      - name: Build and check the installer
        run: node tools/build-installer.mjs

      - name: Keep the unsigned installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenExplainer-installer-unsigned
          path: src-tauri/target/release-files/*
          if-no-files-found: error
