[package]
name = "openexplainer"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Still-image tutorial and how-to book maker"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# For the messages to and from the capture helper. Already part of Tauri's own dependencies.
serde_json = "1"
# For making a PDF (src/pdf.rs): the answer comes back as base64 text. Already part of Tauri's own dependencies.
base64 = "0.22"

# For the built-in AI model (src/models.rs): the SHA-256 fingerprint that shows the downloaded file is the one that was audited. Already in Tauri's own build tools at this version.
sha2 = "0.10"

# The browser engine Tauri uses on Windows (WebView2), asked to print a page to a PDF. Both are already part of Tauri's own dependencies, at these versions.
# The `windows` crate also reads the free disk space and the memory of this PC for the AI model's download (src/models.rs), and ties the model's program to OpenExplainer so it ends with it (src/llama.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# It also asks Windows which program listens on the model's port (src/llama.rs), and makes the one request of Check for updates with Windows' own HTTPS code and opens a release
# page in the author's browser (src/updates.rs).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Checking the 2.7 GB model file took a minute in a development build, where nothing is optimised; with this crate optimised even there it takes a few seconds, as in a release build.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
