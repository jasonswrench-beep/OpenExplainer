[package]
name = "openexplainer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Still-image tutorial and how-to book maker"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# For the messages to and from the capture helper. Already part of Tauri's own dependencies.
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
